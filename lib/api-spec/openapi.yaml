openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: TradeLedger API specification for Australian sole trader tradies
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: dashboard
    description: Dashboard and home screen data
  - name: clients
    description: Client management
  - name: quotes
    description: Quote management
  - name: jobs
    description: Job management
  - name: invoices
    description: Invoice management
  - name: expenses
    description: Expense tracking
  - name: logbook
    description: Vehicle logbook
  - name: subcontractors
    description: Subcontractor management
  - name: settings
    description: User settings
  - name: notifications
    description: Notification management
  - name: tax
    description: Tax intelligence and compliance

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user or unauthenticated state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCurrentAuthUserResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current tradie user profile
      responses:
        "200":
          description: Current tradie user or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradieUserResponse"
        "401":
          description: Unauthorized

  /auth/onboard:
    post:
      operationId: onboardUser
      tags: [auth]
      summary: Complete onboarding for new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardUserBody"
      responses:
        "200":
          description: Onboarding complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradieUserResponse"
        "401":
          description: Unauthorized

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get all home screen stats and financial summary
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "401":
          description: Unauthorized

  /clients:
    get:
      operationId: getClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
        "401":
          description: Unauthorized
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientBody"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          description: Unauthorized

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get client by ID with job history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    put:
      operationId: updateClient
      tags: [clients]
      summary: Update client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientBody"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized

  /quotes:
    get:
      operationId: getQuotes
      tags: [quotes]
      summary: List quotes
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoteSummary"
        "401":
          description: Unauthorized
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Create a new quote with line items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteBody"
      responses:
        "201":
          description: Created quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteDetail"
        "401":
          description: Unauthorized

  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Get quote with line items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quote details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteDetail"
        "401":
          description: Unauthorized
    put:
      operationId: updateQuote
      tags: [quotes]
      summary: Update a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteBody"
      responses:
        "200":
          description: Updated quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteDetail"
        "401":
          description: Unauthorized

  /quotes/{id}/send:
    post:
      operationId: sendQuote
      tags: [quotes]
      summary: Mark quote as sent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quote sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteDetail"
        "401":
          description: Unauthorized

  /quotes/{id}/convert:
    post:
      operationId: convertQuoteToJob
      tags: [quotes]
      summary: Convert accepted quote to a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Created job from quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          description: Unauthorized

  /jobs:
    get:
      operationId: getJobs
      tags: [jobs]
      summary: List jobs
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobSummary"
        "401":
          description: Unauthorized
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobBody"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          description: Unauthorized

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job with costs and invoices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "401":
          description: Unauthorized
    put:
      operationId: updateJob
      tags: [jobs]
      summary: Update job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobBody"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          description: Unauthorized

  /jobs/{id}/status:
    put:
      operationId: updateJobStatus
      tags: [jobs]
      summary: Update job status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobStatusBody"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          description: Unauthorized

  /invoices:
    get:
      operationId: getInvoices
      tags: [invoices]
      summary: List invoices
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: jobId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceSummary"
        "401":
          description: Unauthorized
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceBody"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceDetail"
        "401":
          description: Unauthorized

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get invoice detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceDetail"
        "401":
          description: Unauthorized

  /invoices/{id}/pay:
    post:
      operationId: markInvoicePaid
      tags: [invoices]
      summary: Mark invoice as paid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkInvoicePaidBody"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceDetail"
        "401":
          description: Unauthorized

  /invoices/{id}/remind:
    post:
      operationId: sendInvoiceReminder
      tags: [invoices]
      summary: Log reminder sent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reminder logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized

  /expenses:
    get:
      operationId: getExpenses
      tags: [expenses]
      summary: List expenses
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: jobId
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
        "401":
          description: Unauthorized
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Create expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseBody"
      responses:
        "201":
          description: Created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "401":
          description: Unauthorized

  /expenses/{id}:
    get:
      operationId: getExpense
      tags: [expenses]
      summary: Get expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Expense detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "401":
          description: Unauthorized
    put:
      operationId: updateExpense
      tags: [expenses]
      summary: Update expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseBody"
      responses:
        "200":
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized

  /expenses/summary:
    get:
      operationId: getExpenseSummary
      tags: [expenses]
      summary: Get expense summary stats
      responses:
        "200":
          description: Expense summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseSummary"
        "401":
          description: Unauthorized

  /logbook:
    get:
      operationId: getLogbook
      tags: [logbook]
      summary: Get logbook status
      responses:
        "200":
          description: Logbook status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogbookStatus"
        "401":
          description: Unauthorized

  /logbook/setup:
    post:
      operationId: setupLogbook
      tags: [logbook]
      summary: Initialize logbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupLogbookBody"
      responses:
        "200":
          description: Logbook initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized

  /logbook/trips:
    get:
      operationId: getLogbookTrips
      tags: [logbook]
      summary: List logbook trips
      responses:
        "200":
          description: List of trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleTrip"
        "401":
          description: Unauthorized
    post:
      operationId: logTrip
      tags: [logbook]
      summary: Log a vehicle trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripBody"
      responses:
        "201":
          description: Created trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleTrip"
        "401":
          description: Unauthorized

  /logbook/trips/{id}:
    delete:
      operationId: deleteTrip
      tags: [logbook]
      summary: Delete a trip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized

  /logbook/summary:
    get:
      operationId: getLogbookSummary
      tags: [logbook]
      summary: Get logbook summary with deduction calculation
      responses:
        "200":
          description: Logbook summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogbookSummary"
        "401":
          description: Unauthorized

  /subcontractors:
    get:
      operationId: getSubcontractors
      tags: [subcontractors]
      summary: List subcontractors
      responses:
        "200":
          description: List of subcontractors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subcontractor"
        "401":
          description: Unauthorized
    post:
      operationId: createSubcontractor
      tags: [subcontractors]
      summary: Create subcontractor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubcontractorBody"
      responses:
        "201":
          description: Created subcontractor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subcontractor"
        "401":
          description: Unauthorized

  /subcontractors/tpar:
    get:
      operationId: getTparSummary
      tags: [subcontractors]
      summary: Get TPAR summary for current FY
      responses:
        "200":
          description: TPAR summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TparSummary"
        "401":
          description: Unauthorized

  /subcontractors/{id}:
    put:
      operationId: updateSubcontractor
      tags: [subcontractors]
      summary: Update subcontractor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubcontractorBody"
      responses:
        "200":
          description: Updated subcontractor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subcontractor"
        "401":
          description: Unauthorized

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get user settings
      responses:
        "200":
          description: User settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradieUser"
        "401":
          description: Unauthorized
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsBody"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradieUser"
        "401":
          description: Unauthorized

  /tax/position:
    get:
      operationId: getTaxPosition
      tags: [tax]
      summary: Current tax position with EOFY projection
      responses:
        "200":
          description: Tax position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxPositionResponse"
        "401":
          description: Unauthorized

  /tax/benchmarks:
    get:
      operationId: getTaxBenchmarks
      tags: [tax]
      summary: Compare user's expense ratios against ATO industry benchmarks
      responses:
        "200":
          description: Benchmark comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxBenchmarksResponse"
        "401":
          description: Unauthorized

  /tax/prompts:
    get:
      operationId: getTaxPrompts
      tags: [tax]
      summary: Get contextual deductible prompts for the user's trade type
      responses:
        "200":
          description: Deductible prompts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxPromptsResponse"
        "401":
          description: Unauthorized

  /tax/prompts/{promptKey}/dismiss:
    post:
      operationId: dismissPrompt
      tags: [tax]
      summary: Dismiss a deductible prompt for 30 days
      parameters:
        - in: path
          name: promptKey
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prompt dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized

  /tax/strategies:
    get:
      operationId: getTaxStrategies
      tags: [tax]
      summary: Get personalised tax-minimisation strategies for the current user
      responses:
        "200":
          description: Ranked strategy list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxStrategiesResponse"
        "401":
          description: Unauthorized

  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: List notifications
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          description: Unauthorized

  /notifications/read-all:
    put:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized

  /notifications/{id}/read:
    put:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized

  /uploads/receipt:
    post:
      operationId: uploadReceipt
      tags: [uploads]
      summary: Upload a receipt image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                receipt:
                  type: string
                  format: binary
              required:
                - receipt
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadReceiptResponse"
        "401":
          description: Unauthorized

  /export/invoice/{id}/pdf:
    get:
      operationId: exportInvoicePdf
      tags: [export]
      summary: Export invoice as PDF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /export/quote/{id}/pdf:
    get:
      operationId: exportQuotePdf
      tags: [export]
      summary: Export quote as PDF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /export/data.csv:
    get:
      operationId: exportDataCsv
      tags: [export]
      summary: Export all invoices and expenses as CSV
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Unauthorized

  /export/logbook.pdf:
    get:
      operationId: exportLogbookPdf
      tags: [export]
      summary: Export vehicle logbook as PDF
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
